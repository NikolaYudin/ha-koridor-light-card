type: vertical-stack
cards:
  # ── Блок 1: группа (полное управление) ──
  - type: custom:mushroom-light-card
    entity: light.koridor
    name: Коридор
    icon: mdi:ceiling-light-multiple
    show_brightness_control: true
    show_color_temp_control: true
    show_color_control: true
    show_slider_control: true
    collapsible_controls: false

  # ── Блок 2: лампы-пилюли с живым градиентом, без иконок ──
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:mushroom-light-card
        entity: light.camelion1
        show_slider_control: true
        collapsible_controls: false
        tap_action:
          action: toggle
        card_mod:
          style:
            .: |
              {% if is_state('light.camelion1','on') %}
              ha-card {
                background: linear-gradient(90deg,
                  rgba({{ (state_attr('light.camelion1','rgb_color') or [255,190,90])[0] }}, {{ (state_attr('light.camelion1','rgb_color') or [255,190,90])[1] }}, {{ (state_attr('light.camelion1','rgb_color') or [255,190,90])[2] }}, 0.40) 0%,
                  rgba({{ (state_attr('light.camelion1','rgb_color') or [255,190,90])[0] }}, {{ (state_attr('light.camelion1','rgb_color') or [255,190,90])[1] }}, {{ (state_attr('light.camelion1','rgb_color') or [255,190,90])[2] }}, 0.22) {{ ((state_attr('light.camelion1','brightness') or 255) / 255 * 100) | round(0) | int }}%,
                  rgba(0, 0, 0, 0) {{ ((state_attr('light.camelion1','brightness') or 255) / 255 * 100) | round(0) | int }}%) !important;
              }
              {% else %}
              ha-card {
                background: var(--ha-card-background, var(--card-background-color)) !important;
              }
              {% endif %}
            mushroom-state-item$: |
              .icon {
                display: none !important;
              }
      - type: custom:mushroom-light-card
        entity: light.camelion2
        show_slider_control: true
        collapsible_controls: false
        tap_action:
          action: toggle
        card_mod:
          style:
            .: |
              {% if is_state('light.camelion2','on') %}
              ha-card {
                background: linear-gradient(90deg,
                  rgba({{ (state_attr('light.camelion2','rgb_color') or [255,190,90])[0] }}, {{ (state_attr('light.camelion2','rgb_color') or [255,190,90])[1] }}, {{ (state_attr('light.camelion2','rgb_color') or [255,190,90])[2] }}, 0.40) 0%,
                  rgba({{ (state_attr('light.camelion2','rgb_color') or [255,190,90])[0] }}, {{ (state_attr('light.camelion2','rgb_color') or [255,190,90])[1] }}, {{ (state_attr('light.camelion2','rgb_color') or [255,190,90])[2] }}, 0.22) {{ ((state_attr('light.camelion2','brightness') or 255) / 255 * 100) | round(0) | int }}%,
                  rgba(0, 0, 0, 0) {{ ((state_attr('light.camelion2','brightness') or 255) / 255 * 100) | round(0) | int }}%) !important;
              }
              {% else %}
              ha-card {
                background: var(--ha-card-background, var(--card-background-color)) !important;
              }
              {% endif %}
            mushroom-state-item$: |
              .icon {
                display: none !important;
              }
      - type: custom:mushroom-light-card
        entity: light.camelion3
        show_slider_control: true
        collapsible_controls: false
        tap_action:
          action: toggle
        card_mod:
          style:
            .: |
              {% if is_state('light.camelion3','on') %}
              ha-card {
                background: linear-gradient(90deg,
                  rgba({{ (state_attr('light.camelion3','rgb_color') or [255,190,90])[0] }}, {{ (state_attr('light.camelion3','rgb_color') or [255,190,90])[1] }}, {{ (state_attr('light.camelion3','rgb_color') or [255,190,90])[2] }}, 0.40) 0%,
                  rgba({{ (state_attr('light.camelion3','rgb_color') or [255,190,90])[0] }}, {{ (state_attr('light.camelion3','rgb_color') or [255,190,90])[1] }}, {{ (state_attr('light.camelion3','rgb_color') or [255,190,90])[2] }}, 0.22) {{ ((state_attr('light.camelion3','brightness') or 255) / 255 * 100) | round(0) | int }}%,
                  rgba(0, 0, 0, 0) {{ ((state_attr('light.camelion3','brightness') or 255) / 255 * 100) | round(0) | int }}%) !important;
              }
              {% else %}
              ha-card {
                background: var(--ha-card-background, var(--card-background-color)) !important;
              }
              {% endif %}
            mushroom-state-item$: |
              .icon {
                display: none !important;
              }
      - type: custom:mushroom-light-card
        entity: light.camelion4

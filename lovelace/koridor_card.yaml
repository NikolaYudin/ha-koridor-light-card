  # ── Блок 3: сцены с индикацией по памяти + состоянию ──
  - type: heading
    heading: Сцены
    heading_style: subtitle
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-template-card
        layout: vertical
        primary: Яркий
        icon: mdi:sun-angle
        icon_color: >-
          {{ 'amber' if is_state('input_text.koridor_last_scene','bright')
          and is_state('light.koridor','on') and
          (state_attr('light.koridor','brightness') | int(0)) >= 200 else
          'disabled' }}
        tap_action:
          action: call-service
          service: script.koridor_scene_bright
      - type: custom:mushroom-template-card
        layout: vertical
        primary: Ночной
        icon: mdi:weather-night
        icon_color: >-
          {{ 'indigo' if is_state('input_text.koridor_last_scene','night')
          and is_state('light.koridor','on') and
          (state_attr('light.koridor','brightness') | int(0)) <= 128 and
          is_state('light.camelion1','on') else 'disabled' }}
        tap_action:
          action: call-service
          service: script.koridor_scene_night
      - type: custom:mushroom-template-card
        layout: vertical
        primary: Цветы
        icon: mdi:flower
        icon_color: >-
          {{ 'purple' if is_state('input_text.koridor_last_scene','flowers')
          and is_state('light.camelion4','on') and
          state_attr('light.camelion4','brightness') == 38 and
          is_state('light.camelion1','off') and
          is_state('light.camelion2','off') and
          is_state('light.camelion3','off') else 'disabled' }}
        tap_action:
          action: call-service
          service: script.koridor_scene_flowers

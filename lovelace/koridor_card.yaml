type: vertical-stack
cards:
  # ── Блок 1: группа ──
  - type: custom:mushroom-light-card
    entity: light.koridor
    name: Коридор
    icon: mdi:ceiling-light-multiple
    show_brightness_control: true
    show_color_temp_control: true
    show_color_control: true
    show_slider_control: true
    collapsible_controls: false

  # ── Блок 2: лампы (тап = вкл/выкл, индикация = цвет иконки) ──
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Л1
        icon: mdi:ceiling-light
        color: "{{ 'amber' if is_state('light.camelion1','on') else 'disabled' }}"
        tap_action:
          action: call-service
          service: light.toggle
          target:
            entity_id: light.camelion1
        hold_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Л2
        icon: mdi:ceiling-light
        color: "{{ 'amber' if is_state('light.camelion2','on') else 'disabled' }}"
        tap_action:
          action: call-service
          service: light.toggle
          target:
            entity_id: light.camelion2
        hold_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Л3
        icon: mdi:ceiling-light
        color: "{{ 'amber' if is_state('light.camelion3','on') else 'disabled' }}"
        tap_action:
          action: call-service
          service: light.toggle
          target:
            entity_id: light.camelion3
        hold_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Л4
        icon: mdi:ceiling-light
        color: "{{ 'amber' if is_state('light.camelion4','on') else 'disabled' }}"
        tap_action:
          action: call-service
          service: light.toggle
          target:
            entity_id: light.camelion4
        hold_action:
          action: more-info

  # ── Блок 3: сцены (узкие, активная подсвечивается) ──
  - type: heading
    heading: Сцены
    heading_style: subtitle
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Яркий
        icon: mdi:sun-angle
        color: >-
          {{ 'amber' if is_state('light.koridor','on')
          and (state_attr('light.koridor','brightness') | int(0)) >= 200
          else 'disabled' }}
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.koridor_bright
      - type: custom:mushroom-template-card
        primary: Ночной
        icon: mdi:weather-night
        color: >-
          {{ 'indigo' if is_state('light.koridor','on')
          and (state_attr('light.koridor','brightness') | int(0)) <= 128
          and is_state('light.camelion1','on')
          else 'disabled' }}
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.koridor_night
      - type: custom:mushroom-template-card
        primary: Цветы
        icon: mdi:flower
        color: >-
          {{ 'purple' if is_state('light.camelion4','on')
          and state_attr('light.camelion4','brightness') == 38
          and is_state('light.camelion1','off')
          and is_state('light.camelion2','off')
          and is_state('light.camelion3','off')
          else 'disabled' }}
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.koridor_flowers

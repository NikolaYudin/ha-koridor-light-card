                  rgba({{ (state_attr('light.camelion4','rgb_color') or [255,190,90])[0] }}, {{ (state_attr('light.camelion4','rgb_color') or [255,190,90])[1] }}, {{ (state_attr('light.camelion4','rgb_color') or [255,190,90])[2] }}, 0.22) {{ ((state_attr('light.camelion4','brightness') or 255) / 255 * 100) | round(0) | int }}%,
                  rgba(0, 0, 0, 0) {{ ((state_attr('light.camelion4','brightness') or 255) / 255 * 100) | round(0) | int }}%) !important;
              }
              {% else %}
              ha-card {
                background: var(--ha-card-background, var(--card-background-color)) !important;
